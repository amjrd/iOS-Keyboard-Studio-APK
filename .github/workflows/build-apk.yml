name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/android@latest @capacitor/cli@latest --save-dev --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Configure Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Keyboard-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
